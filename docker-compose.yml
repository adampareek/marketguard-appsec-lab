services:
  vulnerable:
    build: .
    environment:
      LAB_MODE: vulnerable
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"

  secure:
    build: .
    environment:
      LAB_MODE: secure
      APP_SECRET: local-compose-secret-change-me
      HOST: 0.0.0.0
      PORT: 5001
    ports:
      - "127.0.0.1:5001:5001"
